<!doctype html>
<html lang="zh-CN" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸间 · 注册 — 开启你的阅读之旅</title>
<meta name="description" content="注册纸间账号，收藏喜欢的小说，同步阅读进度。">
<meta name="theme-color" content="#F5EFE6">
<link rel="stylesheet" href="/novel/style.css?v=6">
<style>
  .register { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; padding: var(--sp-6) var(--sp-4); }
  .msg { padding: var(--sp-3); border-radius: var(--r-btn); font-size: 14px; margin-bottom: var(--sp-3); display: none; }
  .msg--error { background: #FDECEC; color: var(--vermilion-deep); border: 1px solid #F5C6C6; }
  .msg--success { background: #E8F5E9; color: #2E7D32; border: 1px solid #C8E6C9; }
  .msg.show { display: block; }
  .field__hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
</style>
</head>
<body class="paper-grain">
<main class="register">
  <div class="wrap">
    <div class="login__brand rise">
      <div class="login__seal" aria-hidden="true">纸</div>
      <h1 class="login__title">创建账号</h1>
      <p class="login__tagline">纸间 · 专属你的阅读空间</p>
    </div>

    <div id="msg" class="msg"></div>

    <form class="login__form rise-2" id="registerForm">
      <div class="field">
        <label class="field__label" for="username">用户名</label>
        <input class="field__input" id="username" name="username" type="text" placeholder="3-20个字符" required minlength="3" maxlength="20">
      </div>
      <div class="field">
        <label class="field__label" for="email">邮箱（可选）</label>
        <input class="field__input" id="email" name="email" type="email" placeholder="用于找回密码">
      </div>
      <div class="field">
        <label class="field__label" for="password">密码</label>
        <input class="field__input" id="password" name="password" type="password" placeholder="至少6位" required minlength="6">
      </div>
      <div class="field">
        <label class="field__label" for="password2">确认密码</label>
        <input class="field__input" id="password2" name="password2" type="password" placeholder="再次输入密码" required>
      </div>
      <button class="btn btn--primary btn--block" type="submit">注 册</button>
    </form>

    <p class="login__footer rise-3">
      已有账号？<a href="/login">立即登录</a>
    </p>
  </div>
</main>
<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const username = document.getElementById('username').value.trim();
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const password2 = document.getElementById('password2').value;

  if (password !== password2) {
    msg.className = 'msg msg--error show';
    msg.textContent = '两次输入的密码不一致';
    return;
  }

  try {
    const res = await fetch('/api/register', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password })
    });
    const data = await res.json();
    if (data.ok) {
      msg.className = 'msg msg--success show';
      msg.textContent = '注册成功！正在跳转...';
      setTimeout(() => window.location.href = '/', 1000);
    } else {
      msg.className = 'msg msg--error show';
      msg.textContent = data.message || '注册失败';
    }
  } catch (err) {
    msg.className = 'msg msg--error show';
    msg.textContent = '网络错误，请重试';
  }
});
</script>
</body>
</html>
