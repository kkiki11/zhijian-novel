<!doctype html>
<html lang="zh-CN" data-type="software">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>纸间 · 书架 — 我的藏书</title>
<meta name="description" content="纸间书架，收录你正在读和想读的小说，自动同步阅读进度。">
<meta name="theme-color" content="#F5EFE6">
<link rel="stylesheet" href="/novel/style.css?v=7">
<script>if(!matchMedia('(prefers-reduced-motion: reduce)').matches)document.documentElement.classList.add('anim')</script>
</head>
<body class="paper-grain">

<header class="topbar">
  <div class="topbar__inner">
    <a class="brand" href="/" aria-label="纸间首页">
      <span class="brand__seal" aria-hidden="true">纸</span>
      纸间
    </a>
    <div style="display:flex;align-items:center;gap:8px;" id="userArea">
      <button class="icon-btn" type="button" aria-label="搜索">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/>
          <line x1="20" y1="20" x2="16.5" y2="16.5"/>
        </svg>
      </button>
    </div>
  </div>
  <div class="wrap">
    <div class="tabs" role="tablist" aria-label="内容分类">
      <button class="tab" role="tab" aria-selected="true" type="button">书架</button>
      <button class="tab" role="tab" aria-selected="false" type="button">发现</button>
      <button class="tab" role="tab" aria-selected="false" type="button" onclick="window.location.href='/admin'">管理</button>
    </div>
  </div>
</header>

<main class="page">
  <div class="wrap">
    <h2 class="section-label rise">全部藏书 <span class="more" id="novelCount">共 0 本</span></h2>
    <div class="shelf-grid" id="shelfGrid">
      <div class="empty">加载中...</div>
    </div>
  </div>
</main>

<nav class="tabbar" aria-label="主导航">
  <div class="tabbar__inner">
    <a class="tabbar__item" href="/" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 4h6a2 2 0 0 1 2 2v14a2 2 0 0 0-2-2H4z"/><path d="M20 4h-6a2 2 0 0 0-2 2v14a2 2 0 0 1 2-2h6z"/>
      </svg>书架
    </a>
    <a class="tabbar__item" href="/me" id="navMe">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.5-6 8-6s8 2 8 6"/>
      </svg><span id="navMeText">我的</span>
    </a>
  </div>
</nav>

<script>
async function loadNovels() {
  try {
    const res = await fetch('/api/novels');
    const data = await res.json();
    const grid = document.getElementById('shelfGrid');
    const count = document.getElementById('novelCount');
    if (!data.novels || data.novels.length === 0) {
      grid.innerHTML = '<div class="empty">书架空空如也，快去后台添加小说吧</div>';
      count.textContent = '共 0 本';
      return;
    }
    count.textContent = `共 ${data.novels.length} 本`;
    grid.innerHTML = data.novels.map(n => `
      <a class="book" href="#">
        <div class="book__cover">
          <div style="position:absolute;inset:0;background:${n.cover_color};"></div>
          ${n.status === 'ongoing' ? '<span class="book__badge">连载中</span>' : ''}
        </div>
        <div class="book__title">${n.title}</div>
        <div class="book__progress">${n.author || n.category}</div>
      </a>
    `).join('');
  } catch (err) {
    document.getElementById('shelfGrid').innerHTML = '<div class="empty">加载失败</div>';
  }
}
loadNovels();

// 检查登录状态，更新导航
fetch('/api/me').then(r=>r.json()).then(d=>{
  const navMe = document.getElementById('navMe');
  const navMeText = document.getElementById('navMeText');
  if(d.user){
    navMe.href = '/me';
    navMeText.textContent = d.user.isAdmin ? '管理' : '我的';
  } else {
    navMe.href = '/login';
    navMeText.textContent = '登录';
  }
});
</script>
</body>
</html>
